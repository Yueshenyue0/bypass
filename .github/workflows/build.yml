name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.4'
          channel: 'stable'
          cache: true
      - name: Create Android project files
        run: flutter create . --project-name bypass_app --org com.eri
      - name: Build APK
        run: flutter pub get && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bypass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
