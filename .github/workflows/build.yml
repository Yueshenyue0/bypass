name: Build Bypass

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ====== 缓存：pub 包 ======
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android project files
        run: flutter create . --project-name bypass_app --org com.eri --platforms android

      # ====== 缓存：Gradle ======
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Add permissions to manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="bypass_app"|android:label="Bypass"|' android/app/src/main/AndroidManifest.xml
          grep -n 'INTERNET\|ACCESS_NETWORK_STATE\|POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml || true

      # ====== flutter_local_notifications 需要 desugaring ======
      - name: Enable desugaring for flutter_local_notifications
        run: python3 scripts/enable_desugaring.py

      - name: Get dependencies
        run: flutter pub get

      # ====== 第一遍：构建 APK 拿到 libapp.so ======
      - name: First build (compile Dart libapp.so)
        run: flutter build apk --release --split-per-abi

      # ====== 提取各 ABI libapp.so hash ======
      - name: Extract libapp.so hashes per ABI
        run: |
          set -e
          : > /tmp/hashes.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
              unzip -p "$apk" "lib/$abi/libapp.so" > /tmp/libapp_$abi.so 2>/dev/null && {
                H=$(sha256sum /tmp/libapp_$abi.so | awk '{print $1}')
                echo "$abi $H" >> /tmp/hashes.txt
                echo "ABI=$abi HASH=$H"
                break
              } || true
            done
          done
          cat /tmp/hashes.txt || echo "NO HASHES"

      # ====== 编译 libverify.so，按 ABI 注入 hash ======
      - name: Build libverify.so with injected hashes
        run: |
          set -e
          if [ ! -s /tmp/hashes.txt ]; then
            echo "ERROR: no hashes extracted"; exit 1
          fi
          # 找 NDK
          NDK=""
          [ -n "$ANDROID_NDK_HOME" ] && NDK=$ANDROID_NDK_HOME
          [ -z "$NDK" ] && [ -n "$ANDROID_NDK" ] && NDK=$ANDROID_NDK
          [ -z "$NDK" ] && NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          [ -z "$NDK" ] && NDK=$(ls -d /usr/lib/android-ndk* 2>/dev/null | head -1)
          [ -z "$NDK" ] && { echo "ERROR: NDK not found"; exit 1; }
          echo "NDK=$NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          while read abi hash; do
            case "$abi" in
              arm64-v8a)   CXX="$TC/aarch64-linux-android26-clang++";;
              armeabi-v7a) CXX="$TC/armv7a-linux-androideabi26-clang++";;
              x86_64)      CXX="$TC/x86_64-linux-android26-clang++";;
            esac
            OUT="android/app/src/main/jniLibs/$abi"
            mkdir -p "$OUT"
            "$CXX" -std=c++11 -shared -fPIC \
              -DEXPECTED_LIBAPP_SHA256=\"$hash\" \
              -o "$OUT/libverify.so" lib/native/verify.cpp
            echo "built $OUT/libverify.so ($hash)"
          done < /tmp/hashes.txt
          find android/app/src/main/jniLibs -name 'libverify.so' | sort

      # ====== 第二遍：带 libverify.so 重新打包 ======
      - name: Rebuild APK with libverify.so
        run: |
          rm -rf build/app/intermediates/flutter
          flutter build apk --release --split-per-abi

      - name: Verify native libs in APK
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "=== $(basename $apk) ==="
            unzip -l "$apk" | grep -E 'libverify|libapp|libflutter' || echo "MISSING NATIVE LIBS"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bypass-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn
          retention-days: 14